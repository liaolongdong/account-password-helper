<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Acme Admin Console — Two-factor authentication</title>
    <meta
      name="robots"
      content="noindex"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background:
          radial-gradient(1200px 600px at 15% 10%, #e8efff 0%, transparent 60%),
          radial-gradient(900px 500px at 90% 90%, #e6fbf4 0%, transparent 55%), #f6f8fc;
        color: #0f172a;
      }
      .card {
        width: 380px;
        padding: 40px 36px 32px;
        background: #fff;
        border: 1px solid #e6eaf2;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgb(15 23 42 / 8%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 26px;
      }
      .mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
      }
      .brand-name {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 680;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 0 0 26px;
        font-size: 13.5px;
        color: #64748b;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 7px;
      }
      input[type='text'] {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.34em;
        color: #0f172a;
        background: #fff;
        border: 1px solid #d7dee9;
        border-radius: 9px;
        outline: none;
      }
      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgb(37 99 235 / 12%);
      }
      button {
        width: 100%;
        height: 44px;
        margin-top: 22px;
        font-size: 15px;
        font-weight: 640;
        color: #fff;
        background: #2563eb;
        border: 0;
        border-radius: 9px;
        cursor: pointer;
      }
      .foot {
        margin-top: 22px;
        text-align: center;
        font-size: 12.5px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="mark"></div>
        <div class="brand-name">Acme Admin Console</div>
      </div>
      <h1>Two-factor authentication</h1>
      <p class="sub">Enter the 6-digit code from your authenticator.</p>

      <form onsubmit="return false;">
        <label for="code">Verification code</label>
        <input
          id="code"
          type="text"
          name="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="000000"
        />
        <button type="submit">Verify</button>
      </form>

      <div class="foot">example.com · demo page for screenshots</div>
    </main>
  </body>
</html>
