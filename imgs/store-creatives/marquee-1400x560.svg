    <rect x="860" y="104" width="472" height="404" rx="14" fill="#F5F8FD"/>

    <rect x="880" y="122" width="432" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="906" cy="142" r="7" fill="none" stroke="#9AA7B8" stroke-width="2"/>
    <text x="924" y="147" font-size="14" fill="#9AA7B8">搜索用户名、标签、备注、网址…</text>

