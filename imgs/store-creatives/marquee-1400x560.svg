      <text x="944" y="226" font-size="12.5" fill="#98A2B3">demo.example.com</text>
      <rect x="1228" y="198" width="66" height="24" rx="12" fill="#ECF5FF"/>
      <text x="1261" y="215" font-size="12" fill="#337ECC" text-anchor="middle">开发</text>
    </g>
    <g>
      <rect x="880" y="254" width="432" height="64" rx="12" fill="#FFFFFF" stroke="#EEF2F7" stroke-width="1.5"/>
      <circle cx="914" cy="286" r="16" fill="#E8F1FF"/>
      <circle cx="914" cy="281" r="5" fill="#409EFF"/>
      <path d="M905 295 a9 9 0 0 1 18 0" fill="#409EFF"/>
      <text x="944" y="281" font-size="15" font-weight="600" fill="#1F2937">qa-bot</text>
      <text x="944" y="302" font-size="12.5" fill="#98A2B3">demo.example.com</text>
      <rect x="1228" y="274" width="66" height="24" rx="12" fill="#ECF5FF"/>
      <text x="1261" y="291" font-size="12" fill="#337ECC" text-anchor="middle">测试</text>
    </g>
    <g>
      <rect x="880" y="330" width="432" height="64" rx="12" fill="#FFFFFF" stroke="#EEF2F7" stroke-width="1.5"/>
      <circle cx="914" cy="362" r="16" fill="#E8F1FF"/>
      <circle cx="914" cy="357" r="5" fill="#409EFF"/>
      <path d="M905 371 a9 9 0 0 1 18 0" fill="#409EFF"/>
      <text x="944" y="357" font-size="15" font-weight="600" fill="#1F2937">ops</text>
      <text x="944" y="378" font-size="12.5" fill="#98A2B3">app.example.com</text>
      <rect x="1228" y="350" width="66" height="24" rx="12" fill="#ECF5FF"/>
      <text x="1261" y="367" font-size="12" fill="#337ECC" text-anchor="middle">生产</text>
    </g>
    <g>
      <rect x="880" y="406" width="432" height="64" rx="12" fill="#FFFFFF" stroke="#EEF2F7" stroke-width="1.5"/>
      <circle cx="914" cy="438" r="16" fill="#E8F1FF"/>
      <circle cx="914" cy="433" r="5" fill="#409EFF"/>
      <path d="M905 447 a9 9 0 0 1 18 0" fill="#409EFF"/>
      <text x="944" y="433" font-size="15" font-weight="600" fill="#1F2937">个人账号</text>
      <text x="944" y="454" font-size="12.5" fill="#98A2B3">example.com</text>
      <rect x="1228" y="426" width="66" height="24" rx="12" fill="#ECF5FF"/>
      <text x="1261" y="443" font-size="12" fill="#337ECC" text-anchor="middle">个人</text>
    </g>
