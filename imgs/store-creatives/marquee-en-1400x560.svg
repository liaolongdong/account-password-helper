<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A38"/>
      <stop offset="1" stop-color="#123E77"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#337ECC"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <circle cx="1330" cy="40" r="150" fill="#1E5FA8" opacity="0.28"/>
  <circle cx="320" cy="540" r="120" fill="#1E5FA8" opacity="0.22"/>

  <!-- Brand block: same key glyph as assets/icons/icon.svg -->
  <g>
    <rect x="56" y="56" width="76" height="76" rx="19" fill="url(#primary)"/>
    <g transform="translate(56,56) scale(0.59375)" fill="#FFFFFF">
      <circle cx="64" cy="46" r="20"/>
      <circle cx="64" cy="46" r="8" fill="#409EFF"/>
      <rect x="59" y="62" width="10" height="48" rx="4"/>
      <rect x="69" y="86" width="8" height="6" rx="1.5"/>
      <rect x="69" y="98" width="11" height="6" rx="1.5"/>
    </g>
    <text x="56" y="192" font-size="24" font-weight="700" fill="#FFFFFF">Account Password Helper</text>
    <text x="56" y="220" font-size="15" font-weight="600" fill="#7FB6FF">账号密码管理助手</text>
    <text x="56" y="268" font-size="18" font-weight="600" fill="#6EE7B7">Encrypted locally, never uploaded</text>
    <text x="56" y="298" font-size="14.5" fill="#B8C7DE">Built for developers and testers</text>
    <text x="56" y="321" font-size="14.5" fill="#B8C7DE">managing accounts across environments</text>
  </g>

  <g>
    <rect x="56" y="452" width="282" height="46" rx="23" fill="#FFFFFF" opacity="0.08"/>
    <rect x="56" y="452" width="282" height="46" rx="23" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
    <text x="84" y="482" font-size="15.5" fill="#DCE9FA">Free &amp; open-source · GPL-3.0</text>
  </g>

  <!-- One selling point per card; no competitor names, no crypto parameters -->
  <g>
    <g>
      <rect x="376" y="48" width="482" height="104" rx="16" fill="#FFFFFF" opacity="0.06"/>
      <rect x="376" y="48" width="482" height="104" rx="16" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="418" cy="100" r="21" fill="#1E4F8F"/>
      <path d="M418 88 l11 4 v9 c0 7 -5 12 -11 15 c-6 -3 -11 -8 -11 -15 v-9 z" fill="#6EE7B7"/>
      <text x="456" y="94" font-size="19" font-weight="600" fill="#FFFFFF">Encrypted field by field</text>
      <text x="456" y="124" font-size="13.5" fill="#A9BEDD">Each field is encrypted before it is written</text>
    </g>
    <g>
      <rect x="376" y="168" width="482" height="104" rx="16" fill="#FFFFFF" opacity="0.06"/>
      <rect x="376" y="168" width="482" height="104" rx="16" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="418" cy="220" r="21" fill="#1E4F8F"/>
      <path d="M420 208 l-10 15 h8 l-3 13 l13 -18 h-9 z" fill="#FBBF24"/>
      <text x="456" y="214" font-size="19" font-weight="600" fill="#FFFFFF">Fill and sign in, one click</text>
      <text x="456" y="244" font-size="13.5" fill="#A9BEDD">Finds the form, ticks the box, submits if you allow it</text>
    </g>
    <g>
      <rect x="376" y="288" width="482" height="104" rx="16" fill="#FFFFFF" opacity="0.06"/>
      <rect x="376" y="288" width="482" height="104" rx="16" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="418" cy="340" r="21" fill="#1E4F8F"/>
      <circle cx="418" cy="341" r="10.5" fill="none" stroke="#7FB6FF" stroke-width="3"/>
      <path d="M418 336 v6 l4.5 3" fill="none" stroke="#7FB6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="414" y1="326.5" x2="422" y2="326.5" stroke="#7FB6FF" stroke-width="3" stroke-linecap="round"/>
      <text x="456" y="334" font-size="19" font-weight="600" fill="#FFFFFF">2FA codes and password check-up</text>
      <text x="456" y="364" font-size="13.5" fill="#A9BEDD">Codes on your device, passwords scored 0–100</text>
    </g>
    <g>
      <rect x="376" y="408" width="482" height="104" rx="16" fill="#FFFFFF" opacity="0.06"/>
      <rect x="376" y="408" width="482" height="104" rx="16" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="418" cy="460" r="21" fill="#1E4F8F"/>
      <path d="M411 450 l-7 10 l7 10" fill="none" stroke="#6EE7B7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M425 450 l7 10 l-7 10" fill="none" stroke="#6EE7B7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="421" y1="448" x2="415" y2="472" stroke="#6EE7B7" stroke-width="3.2" stroke-linecap="round"/>
      <text x="456" y="454" font-size="19" font-weight="600" fill="#FFFFFF">Free and open-source, no subscription</text>
      <text x="456" y="484" font-size="13.5" fill="#A9BEDD">Auditable source, no paywall, no account to create</text>
    </g>
  </g>

  <!-- Side panel mock (placeholder data, not real accounts) -->
  <g>
    <rect x="880" y="48" width="456" height="464" rx="18" fill="url(#primary)"/>
    <text x="904" y="86" font-size="18" font-weight="600" fill="#FFFFFF">Account Password Helper</text>
    <rect x="884" y="104" width="448" height="404" rx="14" fill="#F5F8FD"/>

    <rect x="904" y="122" width="408" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="930" cy="142" r="7" fill="none" stroke="#9AA7B8" stroke-width="2"/>
    <text x="948" y="147" font-size="13.5" fill="#9AA7B8">Search by name, tag, note or URL…</text>

    <g>
      <rect x="904" y="178" width="408" height="64" rx="12" fill="#FFFFFF" stroke="#EEF2F7" stroke-width="1.5"/>
      <circle cx="936" cy="210" r="16" fill="#E8F1FF"/>
      <circle cx="936" cy="205" r="5" fill="#409EFF"/>
      <path d="M927 219 a9 9 0 0 1 18 0" fill="#409EFF"/>
      <text x="964" y="205" font-size="14.5" font-weight="600" fill="#1F2937">dev-admin</text>
      <text x="964" y="226" font-size="12" fill="#98A2B3">demo.example.com</text>
      <rect x="1240" y="198" width="56" height="24" rx="12" fill="#ECF5FF"/>
      <text x="1268" y="215" font-size="11.5" fill="#337ECC" text-anchor="middle">dev</text>
    </g>
    <g>
      <rect x="904" y="254" width="408" height="64" rx="12" fill="#FFFFFF" stroke="#EEF2F7" stroke-width="1.5"/>
      <circle cx="936" cy="286" r="16" fill="#E8F1FF"/>
      <circle cx="936" cy="281" r="5" fill="#409EFF"/>
      <path d="M927 295 a9 9 0 0 1 18 0" fill="#409EFF"/>
      <text x="964" y="281" font-size="14.5" font-weight="600" fill="#1F2937">qa-bot</text>
      <text x="964" y="302" font-size="12" fill="#98A2B3">demo.example.com</text>
      <rect x="1240" y="274" width="56" height="24" rx="12" fill="#ECF5FF"/>
      <text x="1268" y="291" font-size="11.5" fill="#337ECC" text-anchor="middle">test</text>
    </g>
    <g>
      <rect x="904" y="330" width="408" height="64" rx="12" fill="#FFFFFF" stroke="#EEF2F7" stroke-width="1.5"/>
      <circle cx="936" cy="362" r="16" fill="#E8F1FF"/>
      <circle cx="936" cy="357" r="5" fill="#409EFF"/>
      <path d="M927 371 a9 9 0 0 1 18 0" fill="#409EFF"/>
      <text x="964" y="357" font-size="14.5" font-weight="600" fill="#1F2937">ops</text>
      <text x="964" y="378" font-size="12" fill="#98A2B3">app.example.com</text>
      <rect x="1240" y="350" width="56" height="24" rx="12" fill="#ECF5FF"/>
      <text x="1268" y="367" font-size="11.5" fill="#337ECC" text-anchor="middle">prod</text>
    </g>
    <g>
      <rect x="904" y="406" width="408" height="64" rx="12" fill="#FFFFFF" stroke="#EEF2F7" stroke-width="1.5"/>
      <circle cx="936" cy="438" r="16" fill="#E8F1FF"/>
      <circle cx="936" cy="433" r="5" fill="#409EFF"/>
      <path d="M927 447 a9 9 0 0 1 18 0" fill="#409EFF"/>
      <text x="964" y="433" font-size="14.5" font-weight="600" fill="#1F2937">personal</text>
      <text x="964" y="454" font-size="12" fill="#98A2B3">example.com</text>
      <rect x="1240" y="426" width="56" height="24" rx="12" fill="#ECF5FF"/>
      <text x="1268" y="443" font-size="11.5" fill="#337ECC" text-anchor="middle">self</text>
    </g>
  </g>
</svg>
