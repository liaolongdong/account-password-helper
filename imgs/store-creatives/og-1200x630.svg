<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A38"/>
      <stop offset="1" stop-color="#123E77"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#337ECC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="150" fill="#1E5FA8" opacity="0.26"/>
  <circle cx="240" cy="620" r="120" fill="#1E5FA8" opacity="0.2"/>

  <!-- 品牌区：主蓝圆角块 + 白色钥匙记号（与 assets/icons/icon.svg 同骨架） -->
  <g>
    <rect x="64" y="96" width="88" height="88" rx="22" fill="url(#primary)"/>
    <g transform="translate(64,96) scale(0.6875)" fill="#FFFFFF">
      <circle cx="64" cy="46" r="20"/>
      <circle cx="64" cy="46" r="8" fill="#409EFF"/>
      <rect x="59" y="62" width="10" height="48" rx="4"/>
      <rect x="69" y="86" width="8" height="6" rx="1.5"/>
      <rect x="69" y="98" width="11" height="6" rx="1.5"/>
    </g>
    <text x="64" y="256" font-size="38" font-weight="700" fill="#FFFFFF">账号密码管理助手</text>
    <text x="64" y="290" font-size="20" font-weight="600" fill="#7FB6FF">Account Password Helper · Chrome 扩展</text>
    <text x="64" y="352" font-size="27" font-weight="600" fill="#6EE7B7">本地加密 · 密码不上传</text>
    <text x="64" y="390" font-size="19" fill="#B8C7DE">为开发者与测试人员的多环境账号而生</text>
  </g>

  <g>
    <rect x="64" y="486" width="288" height="48" rx="24" fill="#FFFFFF" opacity="0.08"/>
    <rect x="64" y="486" width="288" height="48" rx="24" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
    <text x="96" y="517" font-size="17" fill="#DCE9FA">开源免费 · GPL-3.0 协议</text>
  </g>

  <!-- 卖点卡片：一个卖点只讲一次，不写竞品名与技术参数 -->
  <g>
    <g>
      <rect x="500" y="96" width="636" height="128" rx="18" fill="#FFFFFF" opacity="0.06"/>
      <rect x="500" y="96" width="636" height="128" rx="18" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="548" cy="160" r="23" fill="#1E4F8F"/>
      <path d="M548 146 l12 4 v10 c0 8 -5 13 -12 16 c-7 -3 -12 -8 -12 -16 v-10 z" fill="#6EE7B7"/>
      <text x="592" y="153" font-size="24" font-weight="600" fill="#FFFFFF">逐字段本地加密</text>
      <text x="592" y="188" font-size="16" fill="#A9BEDD">账号、密码、验证码分别加密后写入浏览器</text>
    </g>
    <g>
      <rect x="500" y="256" width="636" height="128" rx="18" fill="#FFFFFF" opacity="0.06"/>
      <rect x="500" y="256" width="636" height="128" rx="18" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="548" cy="320" r="23" fill="#1E4F8F"/>
      <path d="M550 306 l-11 16 h9 l-3 14 l14 -19 h-10 z" fill="#FBBF24"/>
      <text x="592" y="313" font-size="24" font-weight="600" fill="#FFFFFF">一键填充并登录</text>
      <text x="592" y="348" font-size="16" fill="#A9BEDD">自动识别表单，勾选协议并按设置点击登录</text>
    </g>
    <g>
      <rect x="500" y="416" width="636" height="128" rx="18" fill="#FFFFFF" opacity="0.06"/>
      <rect x="500" y="416" width="636" height="128" rx="18" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="548" cy="480" r="23" fill="#1E4F8F"/>
      <rect x="536" y="468" width="24" height="17" rx="3" fill="none" stroke="#7FB6FF" stroke-width="2.5"/>
      <path d="M540 475 h16 M540 480 h10" stroke="#7FB6FF" stroke-width="2.2" stroke-linecap="round"/>
      <text x="592" y="473" font-size="24" font-weight="600" fill="#FFFFFF">多环境账号互不串味</text>
      <text x="592" y="508" font-size="16" fill="#A9BEDD">dev / test / staging / prod 精确到子域各管一份</text>
    </g>
  </g>

  <text x="1136" y="592" font-size="17" fill="#8FA9CC" text-anchor="end">liaolongdong.github.io</text>
</svg>
