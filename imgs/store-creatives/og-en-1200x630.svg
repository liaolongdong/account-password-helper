<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A38"/>
      <stop offset="1" stop-color="#123E77"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#337ECC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="30" r="150" fill="#1E5FA8" opacity="0.26"/>
  <circle cx="240" cy="620" r="120" fill="#1E5FA8" opacity="0.2"/>

  <!-- Brand block: primary rounded square + white key glyph (same skeleton as assets/icons/icon.svg) -->
  <g>
    <rect x="64" y="96" width="88" height="88" rx="22" fill="url(#primary)"/>
    <g transform="translate(64,96) scale(0.6875)" fill="#FFFFFF">
      <circle cx="64" cy="46" r="20"/>
      <circle cx="64" cy="46" r="8" fill="#409EFF"/>
      <rect x="59" y="62" width="10" height="48" rx="4"/>
      <rect x="69" y="86" width="8" height="6" rx="1.5"/>
      <rect x="69" y="98" width="11" height="6" rx="1.5"/>
    </g>
    <text x="64" y="254" font-size="30" font-weight="700" fill="#FFFFFF">Account Password Helper</text>
    <text x="64" y="290" font-size="19" font-weight="600" fill="#7FB6FF">Local-first password manager for Chrome</text>
    <text x="64" y="352" font-size="22" font-weight="600" fill="#6EE7B7">Encrypted locally, not uploaded</text>
    <text x="64" y="388" font-size="18" fill="#B8C7DE">For dev / test / staging / prod</text>
  </g>

  <g>
    <rect x="64" y="486" width="330" height="48" rx="24" fill="#FFFFFF" opacity="0.08"/>
    <rect x="64" y="486" width="330" height="48" rx="24" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
    <text x="96" y="517" font-size="17" fill="#DCE9FA">Free &amp; open source · GPL-3.0</text>
  </g>

  <!-- Selling points: one idea each, no competitor names or spec numbers -->
  <g>
    <g>
      <rect x="500" y="96" width="636" height="128" rx="18" fill="#FFFFFF" opacity="0.06"/>
      <rect x="500" y="96" width="636" height="128" rx="18" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="548" cy="160" r="23" fill="#1E4F8F"/>
      <path d="M548 146 l12 4 v10 c0 8 -5 13 -12 16 c-7 -3 -12 -8 -12 -16 v-10 z" fill="#6EE7B7"/>
      <text x="592" y="153" font-size="24" font-weight="600" fill="#FFFFFF">Field-by-field encryption</text>
      <text x="592" y="188" font-size="16" fill="#A9BEDD">Username, password and TOTP encrypted separately</text>
    </g>
    <g>
      <rect x="500" y="256" width="636" height="128" rx="18" fill="#FFFFFF" opacity="0.06"/>
      <rect x="500" y="256" width="636" height="128" rx="18" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="548" cy="320" r="23" fill="#1E4F8F"/>
      <path d="M550 306 l-11 16 h9 l-3 14 l14 -19 h-10 z" fill="#FBBF24"/>
      <text x="592" y="313" font-size="24" font-weight="600" fill="#FFFFFF">One-click fill and sign-in</text>
      <text x="592" y="348" font-size="16" fill="#A9BEDD">Detects the form, ticks the agreement, presses login</text>
    </g>
    <g>
      <rect x="500" y="416" width="636" height="128" rx="18" fill="#FFFFFF" opacity="0.06"/>
      <rect x="500" y="416" width="636" height="128" rx="18" fill="none" stroke="#2E6BB0" stroke-width="1.5"/>
      <circle cx="548" cy="480" r="23" fill="#1E4F8F"/>
      <rect x="536" y="468" width="24" height="17" rx="3" fill="none" stroke="#7FB6FF" stroke-width="2.5"/>
      <path d="M540 475 h16 M540 480 h10" stroke="#7FB6FF" stroke-width="2.2" stroke-linecap="round"/>
      <text x="592" y="473" font-size="24" font-weight="600" fill="#FFFFFF">Environments never mix</text>
      <text x="592" y="508" font-size="16" fill="#A9BEDD">Exact-host matching keeps staging out of production</text>
    </g>
  </g>

  <text x="1136" y="592" font-size="17" fill="#8FA9CC" text-anchor="end">liaolongdong.github.io</text>
</svg>
