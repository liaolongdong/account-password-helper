<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B34"/>
      <stop offset="1" stop-color="#17305C"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#337ECC"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g>
    <rect x="96" y="68" width="52" height="52" rx="13" fill="#409EFF"/>
    <g transform="translate(96,68) scale(0.40625)" fill="#FFFFFF">
      <circle cx="64" cy="46" r="20"/>
      <circle cx="64" cy="46" r="8" fill="#409EFF"/>
      <rect x="59" y="62" width="10" height="48" rx="4"/>
      <rect x="69" y="86" width="8" height="6" rx="1.5"/>
      <rect x="69" y="98" width="11" height="6" rx="1.5"/>
    </g>
    <text x="164" y="104" font-size="27" font-weight="600" fill="#FFFFFF">Account Password Helper</text>
    <text x="1504" y="104" font-size="24" fill="#A9BFE0" text-anchor="end">技术博客 10 / 12</text>
  </g>

  <g>
    <text x="96" y="250" font-size="84" font-weight="700" fill="#FFFFFF">把旧密码库</text>
    <text x="96" y="348" font-size="84" font-weight="700" fill="#FFFFFF">搬进来</text>
    <text x="96" y="418" font-size="38" font-weight="600" fill="#66B3FF">五套表头映射 · 追加不去重</text>
    <text x="96" y="474" font-size="28" fill="#A9BFE0">哪些行会被丢掉，备份该用哪一个</text>
  </g>

  <g font-size="27" font-weight="500">
    <rect x="96" y="512" width="164" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="122" y="550" fill="#CFE3FF">CSV</text>
    <rect x="276" y="512" width="180" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="302" y="550" fill="#CFE3FF">JSON</text>
    <rect x="472" y="512" width="340" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="498" y="550" fill="#CFE3FF">.aph 加密备份</text>
    <rect x="96" y="588" width="300" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="122" y="626" fill="#CFE3FF">UTF-8 → GBK 回退</text>
    <rect x="412" y="588" width="400" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="438" y="626" fill="#CFE3FF">每批要么全写要么全不写</text>
  </g>

  <g>
    <line x1="96" y1="762" x2="640" y2="762" stroke="#23406E" stroke-width="3"/>
    <text x="96" y="812" font-size="26" fill="#A9BFE0">utils/excelFormatMap.ts · 5 套映射</text>
  </g>

  <g>
    <rect x="880" y="196" width="624" height="330" rx="22" fill="#0F1E3D" stroke="#2A4A80" stroke-width="2"/>
    <text x="926" y="252" font-size="24" fill="#A9BFE0">同一列在各家导出里的样子</text>
    <g font-size="24" fill="#CFE3FF" font-family="'SFMono-Regular',Menlo,Consolas,monospace">
      <text x="926" y="304">login_username</text>
      <text x="1220" y="304" fill="#A9BFE0">→ 用户名</text>
      <text x="926" y="352">login_uri</text>
      <text x="1220" y="352" fill="#A9BFE0">→ 网址</text>
      <text x="926" y="400">origin</text>
      <text x="1220" y="400" fill="#A9BFE0">→ 网址</text>
      <text x="926" y="448">grouping</text>
      <text x="1220" y="448" fill="#A9BFE0">→ 标签</text>
      <text x="926" y="496">otpauth</text>
      <text x="1220" y="496" fill="#A9BFE0">→ 两步验证</text>
    </g>
    <rect x="1220" y="288" width="248" height="216" rx="14" fill="#409EFF" fill-opacity="0.06"/>
  </g>

  <g>
    <rect x="880" y="556" width="624" height="140" rx="16" fill="#0F1E3D" stroke="#2A4A80" stroke-width="2"/>
    <g transform="translate(918,586)" stroke="#8FB4FF" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="0" y="18" width="34" height="56" rx="8"/>
      <line x1="17" y1="34" x2="17" y2="58"/>
      <circle cx="17" cy="70" r="3" fill="#8FB4FF" stroke="none"/>
    </g>
    <text x="978" y="622" font-size="28" fill="#CFE3FF">备份用 .aph，不是导出表格</text>
    <text x="978" y="660" font-size="22" fill="#A9BFE0">CSV 里的密码是明文；导出前会做一次往返自检</text>
    <rect x="1310" y="596" width="156" height="38" rx="19" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="1388" y="623" font-size="20" fill="#CFE3FF" text-anchor="middle">新盐新 IV</text>
  </g>

  <g>
    <rect x="880" y="720" width="624" height="70" rx="14" fill="#0F1E3D" stroke="#2A4A80" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="918" y="765" font-size="23" fill="#A9BFE0">没有 xlsx、没有手动选列——这些代码里确实没做</text>
  </g>
</svg>
