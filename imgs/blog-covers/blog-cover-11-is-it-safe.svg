    <text x="96" y="474" font-size="28" fill="#A9BFE0">存在哪、谁能读、丢了怎么办</text>
  </g>

  <g font-size="27" font-weight="500">
    <rect x="96" y="512" width="220" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="122" y="550" fill="#CFE3FF">字段级加密</text>
    <rect x="332" y="512" width="280" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="358" y="550" fill="#CFE3FF">PBKDF2 60 万次</text>
    <rect x="96" y="588" width="280" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
