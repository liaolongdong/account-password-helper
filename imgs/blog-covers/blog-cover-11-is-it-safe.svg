      <text x="926" y="380" fill="#66B3FF" font-weight="600">② 谁能读</text>
      <text x="1080" y="380" fill="#CFE3FF">拿到密文也读不出明文</text>
      <text x="926" y="448" fill="#66B3FF" font-weight="600">③ 丢了怎么办</text>
