<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B34"/>
      <stop offset="1" stop-color="#17305C"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#337ECC"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g>
    <rect x="96" y="68" width="52" height="52" rx="13" fill="#409EFF"/>
    <g transform="translate(96,68) scale(0.40625)" fill="#FFFFFF">
      <circle cx="64" cy="46" r="20"/>
      <circle cx="64" cy="46" r="8" fill="#409EFF"/>
      <rect x="59" y="62" width="10" height="48" rx="4"/>
      <rect x="69" y="86" width="8" height="6" rx="1.5"/>
      <rect x="69" y="98" width="11" height="6" rx="1.5"/>
    </g>
    <text x="164" y="104" font-size="27" font-weight="600" fill="#FFFFFF">Account Password Helper</text>
    <text x="1504" y="104" font-size="24" fill="#A9BFE0" text-anchor="end">技术博客 12 / 12</text>
  </g>

  <g>
    <text x="96" y="250" font-size="84" font-weight="700" fill="#FFFFFF">密码生成器</text>
    <text x="96" y="348" font-size="84" font-weight="700" fill="#FFFFFF">怎么用才安全</text>
    <text x="96" y="418" font-size="38" font-weight="600" fill="#66B3FF">长度 · 熵 · 强度误区</text>
    <text x="96" y="474" font-size="28" fill="#A9BFE0">「看着复杂」为什么骗不过字典</text>
  </g>

  <g font-size="27" font-weight="500">
    <rect x="96" y="512" width="320" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="122" y="550" fill="#CFE3FF">crypto.getRandomValues</text>
    <rect x="432" y="512" width="240" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="458" y="550" fill="#CFE3FF">默认 16 位</text>
    <rect x="96" y="588" width="280" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="122" y="626" fill="#CFE3FF">助记词组 passphrase</text>
    <rect x="392" y="588" width="240" height="56" rx="28" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="418" y="626" fill="#CFE3FF">离线安全体检</text>
  </g>

  <g>
    <line x1="96" y1="762" x2="640" y2="762" stroke="#23406E" stroke-width="3"/>
    <text x="96" y="812" font-size="26" fill="#A9BFE0">utils/passwordGenerator.ts · 真随机</text>
  </g>

  <g>
    <rect x="880" y="196" width="624" height="330" rx="22" fill="#0F1E3D" stroke="#2A4A80" stroke-width="2"/>
    <text x="926" y="252" font-size="24" fill="#A9BFE0">熵 ≈ 长度 × log₂(字符集)</text>
    <g font-size="25" font-family="'SFMono-Regular',Menlo,Consolas,monospace">
      <text x="926" y="312" fill="#CFE3FF">8 位 × 62 字符集</text>
      <text x="1300" y="312" fill="#A9BFE0">≈ 48 bit</text>
      <text x="926" y="368" fill="#CFE3FF">16 位 × 90 字符集</text>
      <text x="1300" y="368" fill="#66B3FF">≈ 104 bit</text>
      <text x="926" y="424" fill="#CFE3FF">6 词助记词组</text>
      <text x="1300" y="424" fill="#A9BFE0">≈ 69 bit</text>
    </g>
    <text x="926" y="486" font-size="23" fill="#A9BFE0">长度翻倍，破解成本翻 2 的几十次方倍</text>
    <rect x="908" y="288" width="568" height="160" rx="14" fill="#409EFF" fill-opacity="0.05"/>
  </g>

  <g>
    <rect x="880" y="556" width="624" height="140" rx="16" fill="#0F1E3D" stroke="#2A4A80" stroke-width="2"/>
    <g transform="translate(918,586)" stroke="#8FB4FF" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="2" y1="14" x2="42" y2="14"/>
      <line x1="2" y1="30" x2="42" y2="30"/>
      <line x1="2" y1="46" x2="42" y2="46"/>
      <circle cx="14" cy="14" r="5" fill="#0F1E3D"/>
      <circle cx="30" cy="30" r="5" fill="#0F1E3D"/>
      <circle cx="20" cy="46" r="5" fill="#0F1E3D"/>
    </g>
    <text x="978" y="622" font-size="28" fill="#CFE3FF">强度条只看形状，体检才看内容</text>
    <text x="978" y="660" font-size="22" fill="#A9BFE0">复用与泄露比对在内存完成，全程不联网</text>
    <rect x="1310" y="596" width="156" height="38" rx="19" fill="#409EFF" fill-opacity="0.16" stroke="#66B3FF" stroke-opacity="0.42" stroke-width="2"/>
    <text x="1388" y="623" font-size="20" fill="#CFE3FF" text-anchor="middle">别只看「强」</text>
  </g>

  <g>
    <rect x="880" y="720" width="624" height="70" rx="14" fill="#0F1E3D" stroke="#2A4A80" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="918" y="765" font-size="23" fill="#A9BFE0">不用记的交给随机生成器，要记的用随机词组</text>
  </g>
</svg>