<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A33"/>
      <stop offset="1" stop-color="#1A3161"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3564"/>
      <stop offset="1" stop-color="#16264B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5D97FF"/>
      <stop offset="1" stop-color="#2F5FD0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint circuit traces -->
  <g stroke="#4E88FF" stroke-width="2" fill="none" opacity="0.22">
    <path d="M0 150 H300 L360 210 H560"/>
    <path d="M1600 180 H1280 L1220 240 H1040"/>
    <path d="M0 760 H260 L320 700 H520"/>
    <path d="M1600 730 H1320 L1260 790 H1060"/>
  </g>
  <g fill="#4E88FF" opacity="0.4">
    <circle cx="560" cy="210" r="6"/>
    <circle cx="1040" cy="240" r="6"/>
    <circle cx="520" cy="700" r="6"/>
    <circle cx="1060" cy="790" r="6"/>
  </g>

  <!-- spine linking the four feature cards -->
  <g stroke="#8FB4FF" stroke-width="3" stroke-dasharray="14 14" opacity="0.5">
    <line x1="250" y1="450" x2="1350" y2="450"/>
  </g>

  <!-- card 1: right-click context menu -->
  <g transform="translate(180,320)">
    <rect width="240" height="260" rx="22" fill="url(#card)" stroke="#3A63B0" stroke-width="2"/>
    <g transform="translate(38,40)">
      <rect width="164" height="30" rx="8" fill="url(#accent)"/>
      <rect y="42" width="164" height="20" rx="6" fill="#2C4B8F"/>
      <rect y="70" width="164" height="20" rx="6" fill="#2C4B8F"/>
      <rect y="98" width="120" height="20" rx="6" fill="#2C4B8F"/>
      <g fill="#8FB4FF">
        <circle cx="16" cy="15" r="5"/>
        <circle cx="16" cy="52" r="4"/>
        <circle cx="16" cy="80" r="4"/>
        <circle cx="16" cy="108" r="4"/>
      </g>
      <!-- mouse cursor pointing at the menu -->
      <path d="M136 118 L166 148 H146 L152 166 L142 170 L136 152 L126 162 Z" fill="#FFFFFF" stroke="#16264B" stroke-width="2"/>
    </g>
  </g>

  <!-- card 2: inline panel anchored to an input, flipping upward -->
  <g transform="translate(480,320)">
    <rect width="240" height="260" rx="22" fill="url(#card)" stroke="#3A63B0" stroke-width="2"/>
    <g transform="translate(36,46)">
      <!-- login input with key icon -->
      <rect width="168" height="30" rx="8" fill="#0F1E3D" stroke="#3A63B0" stroke-width="2"/>
      <circle cx="150" cy="12" r="7" fill="none" stroke="#8FB4FF" stroke-width="3"/>
      <path d="M150 19 V34 M150 28 H157 M150 33 H155" stroke="#8FB4FF" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- mini panel above (space-aware flip) -->
      <rect x="0" y="-38" width="168" height="30" rx="8" fill="url(#accent)" opacity="0.9"/>
      <g fill="#8FB4FF">
        <rect x="64" y="46" width="40" height="4" rx="2"/>
      </g>
      <path d="M84 96 V56" stroke="#5D97FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M70 72 L84 54 L98 72" stroke="#5D97FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- list rows with a clipped bottom row: height compression -->
      <g transform="translate(0,104)">
        <rect width="168" height="20" rx="6" fill="#2C4B8F"/>
        <rect y="28" width="168" height="20" rx="6" fill="#2C4B8F"/>
        <rect y="56" width="168" height="20" rx="6" fill="#2C4B8F" opacity="0.55"/>
      </g>
    </g>
  </g>

  <!-- card 3: site-wide search (magnifier over a segmented scope pill) -->
  <g transform="translate(780,320)">
    <rect width="240" height="260" rx="22" fill="url(#card)" stroke="#3A63B0" stroke-width="2"/>
    <g transform="translate(36,78)">
      <!-- scope segmented control: this site (dim) / all entries (active) -->
      <rect width="168" height="44" rx="22" fill="#0F1E3D" stroke="#3A63B0" stroke-width="2"/>
      <rect x="86" width="82" height="44" rx="22" fill="url(#accent)"/>
      <g fill="#8FB4FF">
        <circle cx="42" cy="22" r="6"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="116" cy="22" r="6"/>
        <circle cx="136" cy="22" r="6"/>
        <circle cx="152" cy="22" r="6"/>
      </g>
      <!-- magnifier scanning the whole vault -->
      <g transform="translate(52,44)">
        <circle cx="40" cy="56" r="34" fill="none" stroke="#8FB4FF" stroke-width="8"/>
        <line x1="64" y1="80" x2="92" y2="108" stroke="#8FB4FF" stroke-width="12" stroke-linecap="round"/>
        <path d="M22 56 A18 18 0 0 1 58 56" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      </g>
    </g>
  </g>

  <!-- card 4: read-only detail drawer -->
  <g transform="translate(1080,320)">
    <rect width="240" height="260" rx="22" fill="url(#card)" stroke="#3A63B0" stroke-width="2"/>
    <g transform="translate(30,52)">
      <!-- manager list -->
      <rect width="112" height="156" rx="10" fill="#0F1E3D" stroke="#3A63B0" stroke-width="2"/>
      <g fill="#2C4B8F">
        <rect x="12" y="16" width="88" height="16" rx="5"/>
        <rect x="12" y="44" width="88" height="16" rx="5"/>
        <rect x="12" y="72" width="88" height="16" rx="5"/>
        <rect x="12" y="100" width="60" height="16" rx="5"/>
      </g>
      <!-- drawer sliding out on the right -->
      <g transform="translate(102,0)">
        <rect width="82" height="156" rx="10" fill="url(#accent)"/>
        <g fill="#FFFFFF" opacity="0.9">
          <rect x="12" y="18" width="58" height="8" rx="4"/>
          <!-- masked password -->
          <g transform="translate(12,40)">
            <circle cx="5" cy="4" r="4"/>
            <circle cx="19" cy="4" r="4"/>
            <circle cx="33" cy="4" r="4"/>
            <circle cx="47" cy="4" r="4"/>
          </g>
          <rect x="12" y="60" width="44" height="8" rx="4"/>
          <rect x="12" y="80" width="58" height="8" rx="4"/>
          <rect x="12" y="100" width="36" height="8" rx="4"/>
          <rect x="12" y="124" width="52" height="10" rx="5" opacity="0.6"/>
        </g>
      </g>
      <!-- open eye: read-only, no edit -->
      <g transform="translate(124,26)">
        <path d="M-16 0 Q0 -13 16 0 Q0 13 -16 0 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        <circle r="5" fill="#16264B"/>
      </g>
    </g>
  </g>

  <!-- small "+" quick add badge floating above card 3 -->
  <g transform="translate(900,272)">
    <circle r="22" fill="url(#accent)"/>
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
      <line x1="-11" y1="0" x2="11" y2="0"/>
      <line x1="0" y1="-11" x2="0" y2="11"/>
    </g>
  </g>
</svg>
