<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#ECF5FF"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD04B"/>
      <stop offset="1" stop-color="#E6A23C"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="90" r="150" fill="#D9ECFF" opacity="0.5"/>
  <circle cx="120" cy="870" r="140" fill="#D9ECFF" opacity="0.45"/>

  <!-- 品牌角标 -->
  <g>
    <rect x="96" y="68" width="52" height="52" rx="13" fill="#409EFF"/>
    <g transform="translate(96,68) scale(0.40625)" fill="#FFFFFF">
      <circle cx="64" cy="46" r="20"/>
      <circle cx="64" cy="46" r="8" fill="#409EFF"/>
      <rect x="59" y="62" width="10" height="48" rx="4"/>
      <rect x="69" y="86" width="8" height="6" rx="1.5"/>
      <rect x="69" y="98" width="11" height="6" rx="1.5"/>
    </g>
    <text x="164" y="104" font-size="27" font-weight="600" fill="#1F2937">Account Password Helper</text>
    <text x="1504" y="104" font-size="24" fill="#9CA3AF" text-anchor="end">技术博客 02 / 04</text>
  </g>

  <!-- 文字层 -->
  <g>
    <text x="96" y="282" font-size="84" font-weight="700" fill="#1F2937">侧边栏 1 秒内打开</text>
    <text x="96" y="352" font-size="38" font-weight="600" fill="#409EFF">双层保活 · 四层预热 · 三路竞速</text>
    <text x="96" y="414" font-size="28" fill="#6B7280">白屏的四段来源，四套对策</text>
  </g>
  <g font-size="27" font-weight="500">
    <rect x="96" y="452" width="314" height="56" rx="28" fill="#ECF5FF" stroke="#D9ECFF" stroke-width="2"/>
    <text x="122" y="490" fill="#337ECC">20–50ms 缓存快路径</text>
    <rect x="426" y="452" width="198" height="56" rx="28" fill="#ECF5FF" stroke="#D9ECFF" stroke-width="2"/>
    <text x="452" y="490" fill="#337ECC">非阻塞 CSS</text>
    <rect x="96" y="528" width="248" height="56" rx="28" fill="#ECF5FF" stroke="#D9ECFF" stroke-width="2"/>
    <text x="122" y="566" fill="#337ECC">手势链不 await</text>
  </g>

  <!-- 浏览器窗口 + 高亮侧边栏 -->
  <g>
    <rect x="1120" y="210" width="380" height="350" rx="22" fill="#FFFFFF" stroke="#D9ECFF" stroke-width="3"/>
    <rect x="1120" y="210" width="380" height="54" rx="22" fill="#ECF5FF"/>
    <rect x="1120" y="240" width="380" height="24" fill="#ECF5FF"/>
    <circle cx="1158" cy="239" r="8" fill="#F56C6C"/>
    <circle cx="1184" cy="239" r="8" fill="#E6A23C"/>
    <circle cx="1210" cy="239" r="8" fill="#67C23A"/>
    <g fill="#DCEBFF">
      <rect x="1150" y="292" width="140" height="18" rx="9"/>
      <rect x="1150" y="322" width="112" height="12" rx="6"/>
      <rect x="1150" y="344" width="128" height="12" rx="6"/>
    </g>
    <rect x="1150" y="384" width="90" height="26" rx="13" fill="#409EFF" opacity="0.85"/>
    <rect x="1320" y="264" width="180" height="296" fill="#409EFF" opacity="0.12"/>
    <rect x="1316" y="264" width="6" height="296" fill="#409EFF"/>
    <g fill="#FFFFFF" stroke="#D9ECFF" stroke-width="2">
      <rect x="1338" y="290" width="142" height="56" rx="10"/>
      <rect x="1338" y="360" width="142" height="56" rx="10"/>
      <rect x="1338" y="430" width="142" height="56" rx="10"/>
    </g>
    <g fill="#409EFF">
      <circle cx="1360" cy="318" r="9"/>
      <circle cx="1360" cy="388" r="9"/>
      <circle cx="1360" cy="458" r="9"/>
    </g>
  </g>

  <!-- 秒表：表盘直接标出 SLA 数值 -->
  <g transform="translate(985,610)">
    <rect x="-30" y="-196" width="60" height="18" rx="9" fill="#337ECC"/>
    <rect x="-16" y="-178" width="32" height="26" rx="8" fill="#409EFF"/>
    <circle r="150" fill="#FFFFFF" stroke="#D9ECFF" stroke-width="6"/>
    <circle r="118" fill="#F4F9FF"/>
    <g stroke="#B8D4F5" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-104" x2="0" y2="-86"/>
      <line x1="0" y1="-104" x2="0" y2="-86" transform="rotate(45)"/>
      <line x1="0" y1="-104" x2="0" y2="-86" transform="rotate(90)"/>
      <line x1="0" y1="-104" x2="0" y2="-86" transform="rotate(135)"/>
      <line x1="0" y1="-104" x2="0" y2="-86" transform="rotate(180)"/>
      <line x1="0" y1="-104" x2="0" y2="-86" transform="rotate(225)"/>
      <line x1="0" y1="-104" x2="0" y2="-86" transform="rotate(270)"/>
      <line x1="0" y1="-104" x2="0" y2="-86" transform="rotate(315)"/>
    </g>
    <text y="26" font-size="72" font-weight="700" fill="#409EFF" text-anchor="middle">&lt;1s</text>
  </g>

  <!-- 运动弧线：提速 -->
  <g stroke="#409EFF" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M804 512 a170 170 0 0 1 34 -84" stroke-width="9"/>
    <path d="M778 610 a190 190 0 0 1 16 -76" stroke-width="7"/>
    <path d="M788 706 a170 170 0 0 1 -8 -68" stroke-width="5"/>
  </g>

  <!-- 闪电 + 速度线 -->
  <path d="M1206 596 L1150 706 H1194 L1168 782 L1266 668 H1216 L1252 596 Z" fill="url(#bolt)"/>
  <g stroke="#409EFF" stroke-width="7" stroke-linecap="round" opacity="0.7">
    <line x1="1046" y1="300" x2="1096" y2="300"/>
    <line x1="1030" y1="336" x2="1096" y2="336"/>
    <line x1="1046" y1="372" x2="1096" y2="372"/>
  </g>

  <!-- 关键源码位置 -->
  <g>
    <line x1="96" y1="762" x2="640" y2="762" stroke="#D9ECFF" stroke-width="3"/>
    <text x="96" y="812" font-size="26" fill="#6B7280">entrypoints/background/backgroundServices.ts</text>
  </g>
</svg>
