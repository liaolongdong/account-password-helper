<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>账号密码管理助手 - 侧边栏</title>
    <style>
      /* ===== 基础重置 ===== */
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* ===== 骨架屏覆盖层 ===== */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        background: #f0f2f5;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        transition: opacity 0.2s ease-out;
      }

      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* ===== 骨架块通用样式 ===== */
      .sk-block {
        background: #e8eaed;
        border-radius: 4px;
        animation: sk-pulse 1.5s ease-in-out infinite;
      }

      @keyframes sk-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ===== 头部栏骨架 ===== */
      .sk-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        margin: 8px 8px 0;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgb(0 0 0 / 6%);
        flex-shrink: 0;
      }

      .sk-header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sk-brand-icon {
        width: 22px;
        height: 22px;
        border-radius: 4px;
      }

      .sk-brand-text {
        width: 80px;
        height: 14px;
      }

      .sk-header-right {
        display: flex;
        gap: 2px;
        align-items: center;
        padding: 3px;
        background: #f1f5f9;
        border-radius: 20px;
      }

      .sk-pill-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
      }

      /* ===== 中性内容占位 ===== */
      .sk-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        padding: 40px 32px;
        margin: 8px 8px 0;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgb(0 0 0 / 6%);
      }

      .sk-content-line {
        height: 12px;
        border-radius: 6px;
      }

      .sk-w80 {
        width: 80%;
      }
      .sk-w60 {
        width: 60%;
      }
      .sk-w90 {
        width: 90%;
      }
      .sk-w45 {
        width: 45%;
      }

      /* ===== 底部按钮骨架 ===== */
      .sk-footer {
        padding: 10px 16px;
        margin: 8px 8px 8px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgb(0 0 0 / 6%);
        flex-shrink: 0;
      }

      .sk-footer-btn {
        width: 100%;
        height: 38px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <!--
      骨架屏覆盖层：作为 Vue 应用的兄弟节点（而非子节点），
      Vue 挂载到 #app 时不会替换骨架屏 DOM。
      骨架屏保持可见直到数据就绪，然后通过 CSS opacity 淡出移除，
      实现 骨架屏 → 真实UI 的无缝过渡，消除中间的 loading spinner 闪烁。
    -->
    <div id="app-loading">
      <!-- 头部栏骨架 -->
      <div class="sk-header">
        <div class="sk-header-left">
          <div class="sk-block sk-brand-icon"></div>
          <div class="sk-block sk-brand-text"></div>
        </div>
        <div class="sk-header-right">
          <div class="sk-block sk-pill-btn"></div>
          <div class="sk-block sk-pill-btn"></div>
          <div class="sk-block sk-pill-btn"></div>
        </div>
      </div>
      <!-- 中性内容占位（不暗示密码列表或空状态，适配认证/未认证两种场景） -->
      <div class="sk-content">
        <div class="sk-block sk-content-line sk-w80"></div>
        <div class="sk-block sk-content-line sk-w60"></div>
        <div class="sk-block sk-content-line sk-w90"></div>
        <div class="sk-block sk-content-line sk-w45"></div>
      </div>
      <!-- 底部按钮骨架 -->
      <div class="sk-footer">
        <div class="sk-block sk-footer-btn"></div>
      </div>
    </div>

    <!-- Vue 应用挂载点（骨架屏的兄弟节点，互不干扰） -->
    <div id="app"></div>

    <script
      type="module"
      src="./main.ts"
    ></script>
  </body>
</html>
