<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>账号密码管理助手 - 设置</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: #f8fbff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #app {
        min-height: 100vh;
      }

      /*
       * 首屏骨架覆盖层：只在 Options 首次加载时出现，覆盖 i18n 初始化 + 认证检查 +
       * 列表解密/渲染的全部窗口。App.vue 在首屏真实视图完成绘制后发出 ready 事件，
       * main.ts 收到后淡出并移除；5s 兜底避免异常时永久遮挡。
       */
      #app-skeleton {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f8fbff;
        opacity: 1;
        transition: opacity 220ms ease;
      }

      #app-skeleton.is-hiding {
        pointer-events: none;
        opacity: 0;
      }

      .sk-block {
        background: #e8ecf2;
        border-radius: 4px;
        animation: sk-pulse 1.5s ease-in-out infinite;
      }

      @keyframes sk-pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.45;
        }
      }

      /* ===== 头部：与实际 HeaderBar 的两行结构对齐 ===== */
      .sk-header {
        padding: 24px 32px;
        margin-bottom: 24px;
        background: linear-gradient(135deg, #409eff 0%, #66b3ff 100%);
        box-shadow: 0 2px 12px rgb(64 158 255 / 15%);
      }

      .sk-header .sk-block {
        background: rgb(255 255 255 / 26%);
      }

      .sk-header-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
      }

      .sk-header-row + .sk-header-row {
        margin-top: 16px;
      }

      .sk-brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .sk-logo {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }

      .sk-title {
        width: 150px;
        height: 16px;
      }

      .sk-subtitle {
        width: 96px;
        height: 11px;
        margin-top: 8px;
      }

      .sk-header-meta {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .sk-chip {
        width: 104px;
        height: 28px;
        border-radius: 14px;
      }

      .sk-chip--short {
        width: 64px;
      }

      .sk-action-group {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .sk-action-group--right {
        margin-left: auto;
        justify-content: flex-end;
      }

      .sk-btn {
        width: 108px;
        height: 32px;
        border-radius: 6px;
      }

      .sk-btn--primary {
        width: 132px;
        background: rgb(255 255 255 / 34%);
      }

      .sk-btn--sm {
        width: 88px;
      }

      /* ===== 主内容：工具条 + 信息行 + 表格卡 ===== */
      .sk-body {
        flex: 1;
        padding: 0 32px 32px;
        overflow: hidden;
      }

      .sk-toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
      }

      .sk-search {
        flex: 1;
        max-width: 520px;
        height: 36px;
        border-radius: 6px;
      }

      .sk-select {
        width: 150px;
        height: 36px;
        border-radius: 6px;
      }

      .sk-star {
        width: 36px;
        height: 36px;
        border-radius: 50%;
      }

      .sk-info {
        margin-bottom: 10px;
      }

      .sk-info-text {
        width: 140px;
        height: 12px;
      }

      .sk-card {
        overflow: hidden;
        background: #fff;
        border: 1px solid #e3f2fd;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgb(64 158 255 / 6%);
      }

      .sk-table-head {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px 16px;
        background: #f5f7fa;
        border-bottom: 1px solid #e3f2fd;
      }

      .sk-check {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }

      .sk-th,
      .sk-cell {
        flex-shrink: 0;
        height: 12px;
        border-radius: 4px;
      }

      .sk-th--user,
      .sk-cell--user {
        width: 18%;
      }

      .sk-th--pass,
      .sk-cell--pass {
        width: 16%;
      }

      .sk-th--url,
      .sk-cell--url {
        width: 24%;
      }

      .sk-th--tag,
      .sk-cell--tag {
        width: 12%;
      }

      .sk-th--time,
      .sk-cell--time {
        width: 9%;
      }

      .sk-th--actions,
      .sk-cell--actions {
        width: 12%;
      }

      .sk-table-row {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid #f0f4f8;
      }

      .sk-table-row:last-of-type {
        border-bottom: 0;
      }

      .sk-actions-mini {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-left: auto;
      }

      .sk-icon {
        width: 20px;
        height: 20px;
        border-radius: 6px;
      }

      .sk-pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
      }

      .sk-page-total {
        width: 100px;
        height: 12px;
      }

      .sk-page-controls {
        display: flex;
        gap: 6px;
      }

      .sk-page-btn {
        width: 28px;
        height: 28px;
        border-radius: 5px;
      }

      .sk-table-row:nth-child(even) .sk-block {
        animation-delay: 0.12s;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-skeleton {
          transition: none;
        }

        .sk-block {
          animation: none;
        }
      }

      @media (max-width: 900px) {
        .sk-header {
          padding: 18px 20px;
        }

        .sk-body {
          padding: 0 20px 24px;
        }

        .sk-toolbar {
          flex-wrap: wrap;
        }

        .sk-search {
          flex-basis: 100%;
          max-width: none;
        }

        .sk-select {
          flex: 1;
          width: auto;
        }

        .sk-th--url,
        .sk-cell--url,
        .sk-th--tag,
        .sk-cell--tag {
          display: none;
        }

        .sk-th--user,
        .sk-cell--user {
          width: 28%;
        }

        .sk-th--pass,
        .sk-cell--pass {
          width: 24%;
        }

        .sk-th--time,
        .sk-cell--time {
          width: 14%;
        }

        .sk-th--actions,
        .sk-cell--actions {
          width: 18%;
        }
      }
    </style>
