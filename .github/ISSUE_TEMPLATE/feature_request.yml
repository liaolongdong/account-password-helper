name: 💡 功能建议 / Feature request
description: Suggest an improvement. 提出新功能或体验改进建议。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        这个项目的设计约束写在 `docs/ARCHITECTURE.md` 和 `.github/SECURITY.md` 里：**本地优先、密码数据不出本机、权限最小化**。
        会突破这三条的建议（云同步、远程托管密钥、放宽 host 权限等）请一并说明你打算如何补偿随之而来的安全代价，否则大概率不会被接受。

        This project is local-first: credential data never leaves the browser, and permissions stay minimal.
        If your idea crosses that line, say how you'd compensate for the security cost — otherwise it will likely be declined.

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题 / The problem
      description: 用具体场景描述，而不是直接给方案。「我在 X 情况下不得不 Y」比「希望有 Z 功能」更有用。
      placeholder: |
        我同时维护 5 个环境的同一个站点，每次都要在侧边栏里靠标签认账号……
    validations:
      required: true
      maxlength: 3000

  - type: textarea
    id: solution
    attributes:
      label: 你期望的做法 / Proposed solution
      description: 界面放在哪、怎么触发、默认值是什么、如何与现有的会话锁定和加密模型共存。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives you've considered
      description: 现在有没有别的办法达到同样目的（哪怕是麻烦一点的）？
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: 涉及的界面 / Affected surfaces
      multiple: true
      options:
        - 管理页 / Options page
        - 侧边栏 / Side panel
        - 工具栏 Popup
        - 页面注入 UI（悬浮按钮、内联面板）/ Injected UI
        - 右键菜单与快捷键 / Context menu & commands
        - 后台 Service Worker / Background
        - 仅文档 / Docs only
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认 / Scope checks
      options:
        - label: 该建议不需要把凭据数据上传到任何服务器
          required: true
        - label: 如果需要新增权限，我已经能说明它的必要性（会触发商店审核复核）
          required: false
        - label: 我愿意提交 PR 实现它
          required: false
