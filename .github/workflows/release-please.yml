name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# 同一时刻只允许一个发版链路在跑：release-please 会读改写同一条自动发布分支，
# 两个 run 交错会把 CHANGELOG / package.json 版本位算乱。cancel-in-progress 必须为
# false——正在等审批或正在提审商店的 run 被取消，等于一次半途而废的发版。
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # ──────────────────────────────────────────────────────────────
    # 发版审批闸门（2026-09-28 接入；三道闸门的最后一道，编号口径见
    # docs/PR_WORKFLOW_GUIDE.md 第 0 节）。
    # 上一段 release-please job 只负责打 tag + 建 GitHub Release；从这个 job 起，
    # 构建、上传 zip 产物、提交 Chrome Web Store 审核是同一条链——一旦放行就不可即时撤回
    # （商店侧只能再传一版重新排队）。所以整段挂在 `production` 环境上，
    # 该环境配置 Required reviewers 后，合入 release PR 只让 run 进入 "waiting for approval"，
    # 必须由维护者在 Actions run 页面点 Approve 才会真正提审。
    # 未配置该环境或环境无审批人时，job 会直接放行——配置步骤见
    # docs/PR_WORKFLOW_GUIDE.md 第 1 节「GitHub 网页端手动设置」。
    # 前置事实：贡献者 PR 合入 main 不会走到这里；只有合并 release-please 自动生成的
    # release PR 才置 release_created=true。
    # ──────────────────────────────────────────────────────────────
    environment: production
    # secrets 上下文不能在 step 级 if 中直接引用，先提升为 job 级 env 供条件判断
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: .output/*-chrome.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # ──────────────────────────────────────────────────────────────
      # Chrome Web Store auto-publish
      # 需要在 GitHub repo Settings → Secrets and variables → Actions 中配置：
      #   CWS_EXTENSION_ID  — 扩展 ID（从 CWS Dashboard 获取）
      #   CWS_CLIENT_ID     — Google Cloud OAuth 2.0 Client ID
      #   CWS_CLIENT_SECRET — Google Cloud OAuth 2.0 Client Secret
      #   CWS_REFRESH_TOKEN — OAuth 2.0 Refresh Token
      # ──────────────────────────────────────────────────────────────
      # mnao305/chrome-extension-upload 的 file-path 不支持 glob 通配符，
      # 会将 ".output/*-chrome.zip" 当作字面文件名打开而报 ENOENT。
      # 因此先解析出实际的 zip 路径（取最新构建产物），再传入发布步骤。
      - name: Resolve extension zip path
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        id: cws_zip
        run: |
          ZIP_PATH="$(ls -t .output/*-chrome.zip | head -n1)"
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved Chrome zip: $ZIP_PATH"

      # 校验 CWS OAuth 凭据：用 refresh_token 换取 access_token。
      # chrome-extension-upload 上传前会先做此交换，返回 400 通常意味着：
      #   - invalid_grant：refresh token 过期/被撤销（OAuth 应用处于 Testing 模式时约 7 天过期，最常见）
      #   - invalid_client：client id/secret 与该 refresh token 不是同一套
      # 本步骤把不透明的 400 转成明确错误信息；仅打印错误体，绝不打印 access_token。
      - name: Verify CWS OAuth credentials
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o token_resp.json -w '%{http_code}' \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "OAuth credentials OK（已获取 access_token，不打印）。若发布仍报 400，问题在扩展条目状态/版本号/包内容，而非凭据。"
            rm -f token_resp.json
          else
            echo "OAuth token exchange failed，HTTP $HTTP_CODE："
            cat token_resp.json
            echo ""
            echo "修复：重新走 OAuth 授权流程生成新的 refresh token，将 client-id/secret/refresh-token 作为同一套更新到仓库 Secrets；并把 OAuth 应用发布为 In production 以避免 token 过期。"
            rm -f token_resp.json
            exit 1
          fi

      # 校验扩展 ID 格式：CWS 扩展 ID 必须是 32 位 a-p 小写字母。
      # Secret 值若混入空格/换行等不可见字符，上传 URL 会变形导致 Google 返回 404，
      # 且该问题不会被 OAuth 凭据校验步骤拦截，故在发布前显式校验并给出明确错误。
      - name: Verify CWS extension id format
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        run: |
          if printf '%s' "$CWS_EXTENSION_ID" | grep -qE '^[a-p]{32}$'; then
            echo "CWS_EXTENSION_ID 格式 OK（32 位 a-p 字母）。"
          else
            echo "CWS_EXTENSION_ID 格式非法：应为 32 位 a-p 小写字母，实际长度 $(printf '%s' "$CWS_EXTENSION_ID" | wc -c | tr -d ' ')。"
            echo "多为复制时带入了空格/换行，请在仓库 Secrets 中重新粘贴纯净的扩展 ID。"
            exit 1
          fi

      - name: Publish to Chrome Web Store
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: ${{ steps.cws_zip.outputs.path }}
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
