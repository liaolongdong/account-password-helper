name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# 同一时刻只允许一个发版链路在跑：release-please 会读改写同一条自动发布分支，
# 两个 run 交错会把 CHANGELOG / package.json 版本位算乱。cancel-in-progress 保持 false。
#
# 2026-10-09 起本 workflow 不再挂 `production` 环境、也不再碰商店——它只做
# 「算版本 → 打 tag → 建 GitHub Release → 挂 zip」。审批闸门搬进 publish.yml，
# 于是「一条卡在审批的发布链堵死后续所有 run」这个 2026-09-29 真实发生过的故障
# （v3.13.1 停在 waiting 十天，期间每次合 main 的新 run 全程 0 job）不再可能在这里复现。
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-attach:
    name: Build and attach zip to Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # 这一段不需要人工审批：GitHub Release 的附件不是用户机器上跑的那份东西，
      # 提审商店才是。闸门位置见 publish.yml 的 `environment: production`。
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: .output/*-chrome.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # 给用户一个下一步的明确指针：合 release PR 之后商店提审不会自动发生，
      # 它由 publish.yml 接 `release: published` 事件、并在 production 环境等人点 Approve。
      - name: Point to the store pipeline
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "### 下一步：提交 Chrome Web Store 审核" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 已生成 Release：\`$RELEASE_TAG\`（zip 已挂为附件）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 商店提审由 **Publish to Chrome Web Store** workflow 接手，它会停在 \`Waiting for approval\`，" >> "$GITHUB_STEP_SUMMARY"
          echo "  需要维护者在 Actions run 页面点 **Review deployments → Approve** 才会真正排队人工审核。" >> "$GITHUB_STEP_SUMMARY"
          echo "- 未点批准 = 商店侧什么都没有发生；这一步不可撤回，所以刻意留给人。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "口径与故障排查见 docs/store/CWS_PUBLISHING_GUIDE.md「第三步」。" >> "$GITHUB_STEP_SUMMARY"
