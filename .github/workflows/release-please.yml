name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # secrets 上下文不能在 step 级 if 中直接引用，先提升为 job 级 env 供条件判断
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: .output/*-chrome.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # ──────────────────────────────────────────────────────────────
      # Chrome Web Store auto-publish
      # 需要在 GitHub repo Settings → Secrets and variables → Actions 中配置：
      #   CWS_EXTENSION_ID  — 扩展 ID（从 CWS Dashboard 获取）
      #   CWS_CLIENT_ID     — Google Cloud OAuth 2.0 Client ID
      #   CWS_CLIENT_SECRET — Google Cloud OAuth 2.0 Client Secret
      #   CWS_REFRESH_TOKEN — OAuth 2.0 Refresh Token
      # ──────────────────────────────────────────────────────────────
      # mnao305/chrome-extension-upload 的 file-path 不支持 glob 通配符，
      # 会将 ".output/*-chrome.zip" 当作字面文件名打开而报 ENOENT。
      # 因此先解析出实际的 zip 路径（取最新构建产物），再传入发布步骤。
      - name: Resolve extension zip path
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        id: cws_zip
        run: |
          ZIP_PATH="$(ls -t .output/*-chrome.zip | head -n1)"
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved Chrome zip: $ZIP_PATH"

      # 校验 CWS OAuth 凭据：用 refresh_token 换取 access_token。
      # chrome-extension-upload 上传前会先做此交换，返回 400 通常意味着：
      #   - invalid_grant：refresh token 过期/被撤销（OAuth 应用处于 Testing 模式时约 7 天过期，最常见）
      #   - invalid_client：client id/secret 与该 refresh token 不是同一套
      # 本步骤把不透明的 400 转成明确错误信息；仅打印错误体，绝不打印 access_token。
      - name: Verify CWS OAuth credentials
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o token_resp.json -w '%{http_code}' \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "OAuth credentials OK（已获取 access_token，不打印）。若发布仍报 400，问题在扩展条目状态/版本号/包内容，而非凭据。"
            rm -f token_resp.json
          else
            echo "OAuth token exchange failed，HTTP $HTTP_CODE："
            cat token_resp.json
            echo ""
            echo "修复：重新走 OAuth 授权流程生成新的 refresh token，将 client-id/secret/refresh-token 作为同一套更新到仓库 Secrets；并把 OAuth 应用发布为 In production 以避免 token 过期。"
            rm -f token_resp.json
            exit 1
          fi

      - name: Publish to Chrome Web Store
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.cws_zip.outputs.path }}
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
