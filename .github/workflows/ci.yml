name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读代码，不写任何权限
permissions:
  contents: read

# 同一分支的新提交取消仍在排队/运行的旧任务，避免并发跑满 Actions 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Type check and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:style
      # 刻意不跑 pnpm format:check：仓库存在尚未格式化的历史文件，接入前先单独清理，
      # 否则本工作流从第一天起就是红的。

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # PBKDF2 相关用例（tests/utils/encryption.test.ts）在并行环境下贴近超时上限，
    # 这里给足整体余量，避免把机器抖动误判成回归。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run

  build:
    name: Build extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 产物级守卫必须对新鲜构建产物跑：`tests/architecture/sidepanelClosure.test.ts`
      # 在 `.output/chrome-mv3` 缺失时整文件跳过，而 `test` 任务不产出该目录——放在那里
      # 等于长期空跑。这里紧随 Chrome 构建执行，覆盖「身份库泄入 sidepanel / popup 首屏」
      # 这类只在产物层才看得见的回归；放在 build:firefox 之前，失败信号更早且不受 Firefox 产物影响。
      - run: pnpm exec vitest run tests/architecture
      - run: pnpm build:firefox
